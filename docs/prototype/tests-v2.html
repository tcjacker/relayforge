<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>测试与验收 交互稿</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#171a21;--card:#1d222b;--line:#2c323d;--text:#e6e9ef;--muted:#a1a8b4;--blue:#9bbaff;--green:#80dba6;--amber:#edbf70;--red:#f0a08e;--note:#192331;--note-line:#35465e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111318;--panel:#171a21;--card:#1d222b;--line:#2c323d;--text:#e6e9ef;--muted:#a1a8b4}}
:root[data-theme="dark"]{--bg:#111318;--panel:#171a21;--card:#1d222b;--line:#2c323d;--text:#e6e9ef;--muted:#a1a8b4}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;display:flex;flex-direction:column}
button,select,input,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:6px;background:#20242d;padding:5px 10px}
button,select{cursor:pointer}
button:hover:not(:disabled){border-color:#7892b7}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.primary{background:#94deb4;color:#11251b;border-color:transparent;font-weight:600}
button.quiet{background:transparent;color:var(--muted)}
button.link{background:transparent;border:0;padding:0;color:var(--blue)}
button.sm,select.sm{font-size:12px;padding:2px 8px}
.muted{color:var(--muted)}.small{font-size:12px}
.mono,pre,textarea.json{font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}
h1,h2,h3{margin:0}
.proto{flex:none;background:#0c0e12;border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.proto button[aria-pressed=true]{background:#293a50;color:#cde0ff;border-color:#627d9c}
.notes{flex:none;background:var(--note);border-bottom:1px solid var(--note-line);padding:8px 16px;font-size:13px}
.notes ul{margin:4px 0 0;padding-left:18px}.notes summary{cursor:pointer;color:var(--blue)}
.scroll{flex:1;min-height:0;overflow-x:auto}
.app{min-width:1200px;height:100%;display:flex;flex-direction:column}
header.top{flex:none;height:44px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:18px;padding:0 16px}
header.top small{margin-left:auto;color:var(--muted)}
.stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.shell{flex:1;min-height:0;display:grid;grid-template-columns:60px minmax(0,1fr)}
.shell.req{grid-template-columns:60px 210px minmax(0,1fr) 420px}
nav.rail{background:var(--panel);border-right:1px solid var(--line);text-align:center;padding:10px 6px}
nav.rail span{display:block;border-radius:8px;margin-bottom:6px;padding:8px 0;color:var(--muted);font-size:12px}
nav.rail .on{background:#293344;color:#c7d8ff}
.col{background:var(--panel);border-right:1px solid var(--line);min-width:0;min-height:0;overflow:auto}
.col .it{padding:8px 12px;border-top:1px solid var(--line)}.col .it.cur{background:#202937}.col .it small{display:block;color:var(--muted)}
.pill{border:1px solid var(--line);border-radius:10px;padding:0 7px;font-size:11px;line-height:1.6;white-space:nowrap;display:inline-block}
.pill.g{color:var(--green);border-color:#35604a}.pill.a{color:var(--amber);border-color:#6a5730}.pill.r{color:var(--red);border-color:#6d4239}.pill.b{color:var(--blue);border-color:#405677}
.center{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line)}
.stabs{flex:none;display:flex;gap:2px;padding:8px 12px 0;border-bottom:1px solid var(--line);background:var(--panel)}
.stab{border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;padding:4px 14px;background:transparent;color:var(--muted)}
.stab.on{background:var(--bg);color:var(--text)}
.term{flex:1;overflow:auto;padding:14px 16px;font:13px/1.7 ui-monospace,Menlo,monospace;color:#c9cfd9;white-space:pre-wrap}
.term .ok{color:var(--green)}.term .no{color:var(--red)}.term .dim{color:#727a88}
aside.side{overflow:auto;padding:16px 18px 40px;background:var(--panel);min-width:0}
aside.side h2{font-size:18px}
aside.side h3,.sec{font-size:12px;color:var(--muted);font-weight:600;margin:18px 0 6px}
.box{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;background:var(--card)}
.box.warn{border-color:#6a5730;background:#231f15}.box.bad{border-color:#6d4239;background:#241917}
.setcard{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;background:var(--card)}
.setcard b{display:block}.setcard .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.bar{display:flex;gap:2px;margin-top:8px}.bar i{flex:1;height:6px;border-radius:2px;background:#555c69}.bar i.p{background:var(--green)}.bar i.f{background:var(--red)}.bar i.n{background:var(--amber)}.bar i.e{background:#b06a5c;background-image:repeating-linear-gradient(45deg,transparent 0 3px,rgba(0,0,0,.35) 3px 6px)}.bar{gap:1px}
.vgrp{padding:6px 12px 2px;font-size:11px;color:var(--muted);background:#14171d;position:sticky;top:0}.vfilter{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px}.vfilter input{width:100%;font-size:12px;margin-top:4px}
.chg{border:1px solid #6a5730;border-radius:8px;background:#231f15;padding:10px 12px;margin:8px 0}.chg.done{border-color:#35604a;background:var(--card)}.chg.no{border-color:#6d4239}.chg .ov{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}.chg pre{padding:4px 8px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;align-items:center}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500}
tr.click{cursor:pointer}tr.click:hover{background:#1b2029}
pre{margin:0;padding:8px 10px;background:#0e1014;border:1px solid var(--line);border-radius:6px;overflow:auto;color:#c9cfd9;white-space:pre-wrap}
/* 测试集查看器 */
.overlay{position:absolute;inset:0;background:rgba(8,9,12,.78);display:flex;align-items:center;justify-content:center;z-index:5;padding:20px}
.viewer{width:1120px;max-width:100%;height:100%;max-height:760px;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.vhead{flex:none;padding:14px 18px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vhead h2{font-size:17px}.vhead .sp{margin-left:auto}
.vtabs{flex:none;display:flex;gap:4px;padding:8px 18px 0;border-bottom:1px solid var(--line)}
.vtab{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--muted);padding:4px 10px 6px}
.vtab.on{color:var(--text);border-bottom-color:var(--blue)}
.vbody{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr)}
.vlist{border-right:1px solid var(--line);overflow:auto}
.vcase{display:flex;gap:8px;width:100%;text-align:left;border:0;border-left:2px solid transparent;border-radius:0;background:transparent;padding:8px 12px;align-items:baseline}
.vcase.cur{background:#202937;border-left-color:var(--blue)}
.vcase .s{flex:none;width:16px;font-weight:700}.vcase .s.p{color:var(--green)}.vcase .s.f{color:var(--red)}.vcase .s.n{color:var(--amber)}
.vmain{overflow:auto;padding:14px 18px 24px}
.io{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.io h3{font-size:12px;color:var(--muted);margin-bottom:4px}
.chat{flex:1;min-height:180px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#0e1014}.msg{display:flex;gap:10px;margin-bottom:10px}.msg>span{flex:none;width:28px;color:var(--muted);font-size:12px;padding-top:2px}.msg.me>div{color:var(--blue)}
textarea.json{width:100%;min-height:110px;background:#0e1014;color:#c9cfd9;resize:vertical}
.diff{color:var(--red)}
/* 验收台 */
.bench{flex:1;min-height:0;display:grid;grid-template-columns:60px 330px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.bench nav.rail{grid-row:1/3}
.envbar{grid-column:2/4;display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.crits{grid-row:2;border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px}
.crit{border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:8px;background:var(--card)}
.crit.good{border-color:#35604a}.crit.bad{border-color:#6d4239}
.work{min-width:0;min-height:0;display:flex;flex-direction:column}
.api{flex:1;min-height:0;display:grid;grid-template-columns:230px minmax(0,1fr)}
.api .ilist{border-right:1px solid var(--line);overflow:auto}
.api .ilist button{display:block;width:100%;text-align:left;border:0;border-radius:0;background:transparent;padding:7px 12px;border-left:2px solid transparent}
.api .ilist button.cur{background:#202937;border-left-color:var(--blue)}
.verb{display:inline-block;width:42px;font:600 11px ui-monospace,monospace}.verb.get{color:var(--green)}.verb.post{color:var(--amber)}
.api .imain{overflow:auto;padding:12px 16px}
.urlbar{display:flex;gap:8px}.urlbar input{flex:1}
.browser{flex:1;min-height:0;display:flex;flex-direction:column;background:#f4f5f7;color:#1b1e24}
.browser .addr{flex:none;display:flex;gap:8px;padding:6px 10px;background:#dfe2e8;align-items:center;font-size:12px}
.browser .addr span{flex:1;background:#fff;border-radius:12px;padding:2px 12px}
.browser .page{flex:1;overflow:auto;padding:18px 24px}
.browser select,.browser button{background:#fff;color:#1b1e24;border-color:#c5c9d1}
.browser table th,.browser table td{border-bottom-color:#dfe2e8;color:#1b1e24}
.logs{flex:none;height:200px;border-top:1px solid var(--line);background:#0e1014;display:flex;flex-direction:column;min-height:0}
.logs .lh{flex:none;display:flex;gap:8px;align-items:center;padding:5px 12px;border-bottom:1px solid var(--line);font-size:12px}
.logs .ll{flex:1;overflow:auto;padding:6px 12px;font:12px/1.7 ui-monospace,Menlo,monospace}
.logs .ll div{display:flex;gap:10px}.logs .ll time{color:#727a88}.logs .ll b{width:44px;font-weight:600}
.lg-ui b{color:var(--blue)}.lg-req b{color:var(--green)}.lg-be b{color:var(--amber)}.lg-err b,.lg-err span{color:var(--red)}
.steps{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;flex-wrap:wrap}.steps span{border:1px solid var(--line);border-radius:12px;padding:1px 10px;color:var(--muted)}.steps span.done{color:var(--green);border-color:#35604a}.steps span.cur{background:#293a50;color:#cde0ff;border-color:#627d9c;font-weight:600}.steps i{font-style:normal;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{border:0;border-radius:0;background:transparent;color:var(--muted);padding:4px 14px}.seg button.on{background:#293a50;color:#cde0ff}
.envsel{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:2px 8px;background:#14171d}.envsel span{font-size:12px;color:var(--muted)}.envsel select{border:0;background:transparent;padding:2px 4px;color:var(--text);font-weight:600}
.plain{flex:1;overflow:auto;padding:24px 28px 60px}.plain .wrap{max-width:1000px}
.tag1,.tag2,.tag3,.tag4{border-radius:4px;padding:0 6px;font-size:11px;white-space:nowrap}
.tag1{background:#1f3a2c;color:var(--green)}.tag2{background:#22324d;color:var(--blue)}.tag3{background:#3a3020;color:var(--amber)}.tag4{background:#2a2d35;color:var(--muted)}
</style>
</head>
<body>
<div class="proto">
  <b>测试与验收 · 交互稿</b>
  <button data-scene="req" aria-pressed="true">① 需求里的测试集</button>
  <button data-scene="manage" aria-pressed="false">② 测试页</button>
  <button data-scene="bench" aria-pressed="false">③ 人工验收</button>
  <button data-scene="list" aria-pressed="false">④ 功能点清单</button>
  <span class="muted small">都是假数据，按钮可以点</span>
</div>
<div class="notes" id="notes"></div>
<div class="scroll"><div class="app">
  <header class="top"><b>RelayForge</b><span class="muted">项目：账单服务</span><small>2 个提交未发布</small></header>
  <div class="stage" id="stage"></div>
</div></div>

<script>
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function J(x) { return JSON.stringify(x, null, 2); }

var NOTES = {
  req: ['右边「全部重跑」上方和查看器顶栏都能选测试环境：测试集用哪套环境跑（连哪个数据库等）。',
    '需求进入验证环节时，AI 按需求生成测试集。一个测试集 = 一份测试数据（JSON）+ 一段读这份数据的测试代码。',
    '数据多的时候只让你看需要看的：右边只列有失败或有新数据的测试集，全部通过的收成一行；条形是通过和失败的比例，不是一条一格。',
    '「这个需求改了以前的数据」：AI 改动已有数据的期望时单独列出旧值和新值，你逐条同意或不同意；没确认完不能去人工验收（可以手动放行）。',
    '查看器里默认只显示「需要看的」（失败、跑不起来、AI 新加的），按正常、边界、异常分组，可以搜索。',
    '查看器像刷题网站跑代码：左边一条条用例，右边是这条的输入、期望输出、实际输出；失败的标红并写明差在哪。',
    '查看器里可以改数据、加一条。「让 AI 改」标签里直接用对话让 AI 改这份数据（补边界值、补异常输入、换一批数据等），然后重跑。',
    '关掉查看器后，右边每个测试集下面有一段分析：哪些过了、哪些没过、为什么。'],
  manage: ['凡是会跑测试的地方都有「测试环境」选择框：测试集管理的右上角、测试集查看器的顶栏、人工测试的顶栏、需求里的测试集和人工验收。选的是同一个设置，旁边的「设置」直接跳到测试环境页。',
    '测试页有三块，标题旁边切换：「测试集管理」「人工测试」「测试环境」。',
    '测试环境：可以建几套环境（本机、测试服…），每套有启动命令、端口、外部依赖、环境变量、请求的通用设置、测试用的登录身份。',
    '测试用户：每个用户带一组自己起名的值（jwt、uid、talent_id…），都能直接编辑；通用请求头里写 {{user.uid}} 这样的引用，发请求时换一个用户，请求头就跟着变。',
    '请求的通用设置：通用的请求头和地址参数，以及发请求之前、收到返回之后各运行一段 JS 脚本（自动登录拿 token、加签名等）。发请求的界面上能看到这次自动带上了什么。',
    '外部依赖（数据库、缓存、第三方服务）默认从项目里你自己的配置文件读出来显示，并检查能不能连上；不用在这里重填一遍。人工测试和人工验收顶上可以选用哪一套。',
    '接口列表上方有「重新读代码，刷新接口说明」：AI 重新生成接口说明文件，列出和上一版的差别给你看。',
    '人工测试和需求里的人工验收是同一套界面（服务、接口、页面、日志），只是不绑需求：默认对着主线，也可以选某个需求的代码；发现不对直接记成问题。',
    '测试集管理：全部测试集的列表，每个挂在哪个需求、哪个功能点下面。',
    '点一行打开的是同一个查看器，可以改数据、让 AI 补数据、重跑。',
    '可以改挂靠（换需求或功能点）、标不要。「提示」只用程序能算的固定规则。',
],
  bench: ['人工验收是这个需求下面的一个标签，和立项、开发并列；左边仍然是需求列表，右边仍然是这个需求的面板。',
    '右边面板顶上有一条进度：开发 › 测试集 › 人工验收 › 确认完成，标出现在走到哪一步。',
    '从哪里进来：需求面板里的「去人工验收」按钮，或者直接点「人工验收」标签。',
    '顶栏的「测试环境」选择框决定用哪套环境启动服务；换了以后服务会重启。',
    '程序用这个需求的代码把整个服务跑起来（后端、前端都起），状态在中间区域的顶上。',
    '「接口」标签像 Postman：选接口、填参数、发送，看真实返回。',
    '「页面」标签是嵌在应用里的真实页面，你直接点，把流程走通。',
    '下面的日志把三样东西按时间排在一起：你在页面上的操作、发出的请求、后端日志。前后端联调时能看出一次点击引起了哪些请求和后端行为。',
    '右边是验收条件，逐条点「通过」或「这里不对」；点「这里不对」时，当时那一段日志会一起交回开发会话。'],
  list: ['这是我现在理解的全部功能点和分期。请看有没有理解错的。']
};

/* ---------- 数据 ---------- */
var B = function (id, d) { return { id: id, booked_at: d }; };
var SETS = [
  { id: 'TS-012', name: '按月筛选账单', req: 'R-20261118-dd36', reqName: '账单列表加按月筛选', feat: 'RF-101 账单列表', inprog: true, hints: [], runAt: '今天 09:40',
    code: 'import json, unittest\nfrom bills import list_bills\nfrom testkit import load_bills\n\nCASES = json.load(open(".relayforge/tests/TS-012.json"))["cases"]\n\nclass FilterByMonth(unittest.TestCase):\n    def test_cases(self):\n        for c in CASES:\n            with self.subTest(c["name"]):\n                load_bills(c["input"]["bills"])\n                got = [b.id for b in list_bills(month=c["input"]["month"])]\n                self.assertEqual(got, c["expect"])',
    cases: [
      { name: '只返回那个月的', input: { bills: [B('b1', '2026-09-30'), B('b2', '2026-10-01'), B('b3', '2026-10-31')], month: '2026-10' }, expect: ['b2', 'b3'], actual: ['b2', 'b3'] },
      { name: '那个月没有账单', input: { bills: [B('b1', '2026-09-30')], month: '2026-10' }, expect: [], actual: [] },
      { name: '不传月份，按本月', input: { bills: [B('b1', '2026-10-05'), B('b2', '2026-11-02')], month: null }, expect: ['b2'], actual: ['b2'] },
      { name: '月底 23:59 记的账', input: { bills: [{ id: 'b1', booked_at: '2026-10-31T23:59', created_at: '2026-11-01T00:03' }], month: '2026-10' }, expect: ['b1'], actual: [], why: '期望返回 b1，实际一条都没有。这张账单的记账时间在十月、创建时间在十一月：结果说明程序是按创建时间分月的。' },
      { name: '跨年：12 月', input: { bills: [B('b1', '2025-12-31'), B('b2', '2026-12-01')], month: '2026-12' }, expect: ['b2'], actual: ['b2'] },
      { name: '月份格式不对', input: { bills: [], month: '2026-13' }, expect: { error: '月份不合法' }, actual: { error: '月份不合法' } }
    ],
    analysis: '6 条里 5 条通过。没通过的「月底 23:59 记的账」：程序按创建时间分月，而验收条件要求按记账时间。其余 5 条覆盖了正常、空结果、默认本月、跨年、非法输入。' },
  { id: 'TS-013', name: '筛选后的合计金额', req: 'R-20261118-dd36', reqName: '账单列表加按月筛选', feat: 'RF-101 账单列表', inprog: true, hints: [], runAt: '今天 09:40',

  var d = t.dataset;
  if (d.go) return show(d.go);
  if (d.envgo) { M.tab = 'env'; E.cur = E.use; return show('manage'); }
  if (V.set && viewerClick(t) !== false) return;
  if (d.mtab) { M.tab = d.mtab; return render(); }
  if (d.env) { E.cur = +d.env; return render(); }
  if (d.user) { E.user = +d.user; return render(); }
  if (d.act === 'jwtfetch') { alert('用这个用户的账号调一次登录接口，把返回的 JWT 填进来。登录接口和账号在脚本或环境变量里配。'); return; }
  if (d.act === 'envuse') { E.use = E.cur; return render(); }
  if (d.act === 'depscan') { alert('程序重新读你选的配置文件，列出里面的数据库和外部服务地址。读不懂的格式会请 AI 帮忙认，认出来的标待确认。'); return; }
  if (d.act === 'depcheck') { alert('程序逐个试连：数据库试登录，HTTP 服务试访问。只检查能不能连上，不写任何数据。'); return; }
  if (d.act === 'envnew') { alert('新建一个环境：起个名字，可以从现有的环境复制一份再改。'); return; }
  if (d.act === 'envai') { alert('开一个聊天，请 AI 读项目的配置文件，把启动命令、端口、需要的环境变量填出来；它填的你确认后才生效，密钥它不会填。'); return; }
  if (d.act === 'postman') { alert('选一个 Postman 导出的文件（集合或环境）。\n· 集合：里面的请求变成存下来的接口用例，文件夹保留成分组，请求头、参数、请求体照搬。\n· 环境：里面的变量变成一套测试环境的变量，标了 secret 的只存本机。\n· 脚本：pre-request 和 tests 脚本一起导入，常用的 pm.* 写法可以直接运行；用到不支持的写法会逐条列出来。\n导入前先给你看会新增哪些内容。'); return; }
  if (d.act === 'apidoc') { alert('请 AI 重新读代码，生成接口说明文件（有哪些接口、参数、返回的结构）。\n生成后列出和上一版相比新增、改了、没了哪些接口，你看过再替换。'); return; }
  if (scene === 'bench' || scene === 'manage' && M.tab === 'manual') return benchClick(t);
  if (d.act === 'move') { alert('选一个需求或功能点，把这个测试集挂过去。'); return; }
  if (d.act === 'stale') { alert('标成过期：不再运行，不删除，在「过期」筛选里能找到，可以恢复。'); return; }
  if (d.act === 'revive') { alert('恢复成在用的测试集，重新参与运行。'); return; }
  if (d.chg) { CHG[+d.chg].v = d.v; return render(); }
  if (d.act === 'drop') { alert('标成不要。标了不要的攒起来，一次交给 AI 删掉数据文件和对应的测试代码。'); return; }
  if (d.act === 'legacy') { alert('新开一个聊天，请 AI 把旧式测试的数据抽出来，改写成测试集。'); return; }
  if (d.act === 'runall' || d.act === 'runreq') { alert('程序把这些测试集全部跑一遍，不调用模型。'); return; }
  if (d.mf) { M.f = d.mf; return render(); }
  var row = e.target.closest('[data-open]');
  if (row) { V.set = SETS.filter(function (s) { return s.id === row.dataset.open; })[0]; V.tab = 'cases'; V.f = ''; V.q = ''; V.cur = Math.max(0, V.set.cases.findIndex(function (c) { return ok(c) === false; })); render(); }
});
show('req');
</script>
</body>
</html>
