<title>RelayForge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Two pages only: 现在 (active branches) and 大图 (facts anchored to main). */
:root {
  --bg: #F4F5F7; --surface: #FFFFFF; --band: #F8F9FB; --sunk: #EEF0F3; --line: #DDE1E8; --line-strong: #B9C0CC;
  --fg: #15171C; --body: #3A4050; --muted: #5A6170; --accent: #1F4FD1; --accent-ink: #163A9C; --accent-soft: #E6EDFB;
  --wait: #7A3606; --wait-soft: #FCEBDD; --wait-line: #E7B98F; --ok: #0B5D4F; --ok-soft: #E3F2EE;
  --sans: Inter, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1217; --surface: #171B23; --band: #1C212B; --sunk: #232936; --line: #2C3442; --line-strong: #465062;
  --fg: #E8EBF1; --body: #C3CAD6; --muted: #98A2B3; --accent: #8FB0FF; --accent-ink: #B7CBFF; --accent-soft: #1D2A48;
  --wait: #F2B87A; --wait-soft: #3A2A16; --wait-line: #6B4A22; --ok: #77D4BE; --ok-soft: #12352E; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1217; --surface: #171B23; --band: #1C212B; --sunk: #232936; --line: #2C3442; --line-strong: #465062;
  --fg: #E8EBF1; --body: #C3CAD6; --muted: #98A2B3; --accent: #8FB0FF; --accent-ink: #B7CBFF; --accent-soft: #1D2A48;
  --wait: #F2B87A; --wait-soft: #3A2A16; --wait-line: #6B4A22; --ok: #77D4BE; --ok-soft: #12352E; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.5 }
button { font: inherit; color: inherit }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
.bar { background: var(--surface); border-bottom: 1px solid var(--line) }
.bar-in, .page { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.bar-in { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 28px }
.brand { display: flex; align-items: center; gap: 10px; padding-block: 14px }
.brand b { font-size: 16px }
.muted, .brand span { color: var(--muted) }
.tabs-top { display: flex; gap: 4px; flex: 1 1 auto }
.tabs-top button { min-height: 44px; padding: 0 16px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer }
.tabs-top button[aria-current="page"] { color: var(--fg); font-weight: 600; border-bottom-color: var(--accent) }
.tabs-top small { margin-left: 6px; font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--muted) }
.tag { padding: 3px 10px; border: 1px dashed var(--line-strong); border-radius: 4px; color: var(--muted); font-size: 12px }
.page { padding-block: 24px 48px; display: flex; flex-direction: column; gap: 20px }
h1 { margin: 0; font-size: 24px; font-weight: 700 }
h2 { margin: 0; font-size: 16px; font-weight: 700 }
h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--muted) }
h4 { margin: 0; font-size: 15px; font-weight: 600 }
.sub { margin: 4px 0 0; color: var(--muted) }
.row { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start }
.side { flex: 1 1 260px; max-width: 320px; min-width: 0 }
.wide { flex: 999 1 480px; min-width: 0 }
.narrow { flex: 1 1 340px; max-width: 440px; min-width: 0 }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden }
.head { padding: 18px 22px; background: var(--band); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px }
.head h2 { font-size: 22px; overflow-wrap: anywhere }
.branch { font-family: var(--mono); font-size: 17px; font-weight: 600; overflow-wrap: anywhere }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 13px; color: var(--muted) }
.body { padding: 20px 22px 24px; display: flex; flex-direction: column; gap: 22px }
.pill { display: inline-block; padding: 1px 9px; border-radius: 10px; font-size: 12px; background: var(--sunk); color: var(--body); white-space: nowrap }
.pill.current, .pill.done { background: var(--ok-soft); color: var(--ok) } .pill.draft, .pill.wait { background: var(--wait-soft); color: var(--wait) }
.pill.decided { background: var(--accent-soft); color: var(--accent-ink) }
.id, .hash { font-family: var(--mono); font-size: 12px; color: var(--muted) }
.lead { margin: 0; font-size: 18px; line-height: 1.5 }
.lead .pill { vertical-align: 3px; margin-left: 8px }
.card { padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; gap: 8px; min-width: 0 }
.card.old { background: var(--sunk); color: var(--muted) }
.stack { display: flex; flex-direction: column; gap: 12px }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px }
ul.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px }
ul.items li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px }
ul.items li.none { color: var(--muted) }
ul.items li.waiting { background: var(--wait-soft); border-radius: 6px; padding: 6px 10px }
.txt { flex: 1 1 220px; min-width: 0; overflow-wrap: anywhere }
.src { font-family: var(--mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap }
.trunk { color: var(--accent); margin-right: 4px }
.link { color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; text-decoration: underline; text-underline-offset: 2px }
details { border: 1px solid var(--line); border-radius: 8px }
details > summary { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-height: 44px; padding: 6px 14px; cursor: pointer; list-style: none }
details > summary::-webkit-details-marker { display: none }
details > summary::before { content: ""; flex: none; width: 7px; height: 7px; border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted); transform: rotate(-45deg); margin-right: 2px }
details[open] > summary::before { transform: rotate(45deg) }
details > summary b { flex: 1 1 auto }
details > div { padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 10px }
.point { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px }
.strip { padding: 12px 14px; border: 1px solid var(--line); background: var(--band); border-radius: 8px; color: var(--body) }
.strip.wait { border-color: var(--wait-line); background: var(--wait-soft) }
.tree { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 2px }
.tree button { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 40px; padding: 4px 8px; text-align: left; background: none; border: 0; border-radius: 6px; cursor: pointer }
.tree button:hover { background: var(--sunk) }
.tree button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink) }
.tree .mod { font-weight: 600 }
.tree .kids { display: flex; flex-direction: column; gap: 2px; margin: 0 0 4px 13px; padding-left: 10px; border-left: 1px solid var(--line) }
.tree .name { flex: 1 1 auto; min-width: 0 }
.tree .aside { flex: none; font-size: 12px; font-weight: 400; color: var(--muted) }
.dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--accent) } .dot.draft { background: var(--wait-line) }
.group { padding: 12px 18px 2px; font-size: 12px; font-weight: 600; color: var(--muted); border-top: 1px solid var(--line) }
.group:first-child { border-top: 0 }
.subtabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 22px 0; border-bottom: 1px solid var(--line) }
.subtabs button { min-height: 40px; padding: 0 14px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--body); cursor: pointer }
.subtabs button[aria-selected="true"] { color: var(--accent-ink); font-weight: 600; border-bottom-color: var(--accent) }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chips button { min-height: 28px; padding: 0 12px; font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; cursor: pointer }
.chips button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600 }
.tile { text-align: left; background: var(--surface); cursor: pointer; font: inherit; color: inherit }
.tile:hover { border-color: var(--accent) }
.paths { display: flex; flex-wrap: wrap; gap: 4px }
.note { margin: 0; padding: 10px 12px; background: var(--sunk); border-radius: 6px; color: var(--body) }
.empty { margin: 0; padding: 22px 18px; text-align: center; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: 8px }
.path { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere }
@media (max-width: 720px) { .side, .narrow { max-width: none } .head, .body { padding-inline: 16px } .subtabs { padding-inline: 16px } }

.status { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px }
.strip-bars { display: flex; align-items: flex-end; gap: 3px; height: 34px }
.strip-bars i { flex: 1 1 0; min-width: 3px; background: var(--sunk); border-radius: 2px; height: 3px }
.strip-bars i.has { background: var(--accent) }
.strip-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px }
.tile { flex: 1 1 0; max-width: 200px; min-width: 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; text-align: left; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; cursor: pointer; font: inherit; color: inherit }
.tile:hover { border-color: var(--accent) }
.tile b { font-size: 15px }
.tile .cnt { font-size: 12px; color: var(--body) }
.tile.mini { max-width: 150px; padding: 8px 12px; background: var(--band); border-color: var(--line); color: var(--muted) }
.tile.mini b { font-size: 13px; font-weight: 500 }
.tile.mini.lit { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink) }
.tile.mini.lit b { font-weight: 700 }
.tile.mini.lit .cnt { color: var(--accent-ink) }
/* 大图：按层分标签页，每页一棵「模块 → 功能点」的树；右边是模块的用户旅程 */
.ltabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 8px 16px 0; border-bottom: 1px solid var(--line); background: var(--band) }
.ltabs button { min-height: 44px; padding: 0 14px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; line-height: 1.3; font: inherit }
.ltabs button b { font-size: 14px; font-weight: 600; color: var(--body) }
.ltabs button small { font-size: 11.5px; color: var(--muted) }
.ltabs button[aria-selected="true"] { border-bottom-color: var(--accent) }
.ltabs button[aria-selected="true"] b { color: var(--fg) }
.ltabs .wmark { font-size: 11px; font-weight: 400; color: var(--wait) }
.hitdot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 6px; vertical-align: 2px }
.maptools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 20px; border-bottom: 1px solid var(--line) }
.maptools .about { font-size: 13px; color: var(--muted); flex: 1 1 200px }
.tbtn { min-height: 28px; padding: 0 10px; font: inherit; font-size: 12.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; color: var(--body) }
.tbtn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg) }
.editbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--surface); font: inherit; font-weight: 600; cursor: pointer }
.editbtn:hover { background: var(--accent-ink); border-color: var(--accent-ink) }
.editbtn[aria-pressed="true"] { background: var(--surface); color: var(--accent-ink) }
.mtree { list-style: none; margin: 0; padding: 10px 12px 12px }
.mnode { border-bottom: 1px solid var(--sunk) }
.mnode:last-child { border-bottom: 0 }
.mnode.dim { opacity: .4 } .mnode.shelved { opacity: .55 }
.mrow { display: grid; grid-template-columns: 22px 1fr auto; column-gap: 8px; align-items: start; padding: 10px 8px; border-radius: 8px; cursor: pointer }
.mrow:hover { background: var(--band) }
.mrow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px }
.mnode.sel > .mrow { background: var(--accent-soft) }
.caret { width: 22px; height: 22px; border-radius: 5px; display: flex; align-items: center; justify-content: center; color: var(--muted) }
.caret:hover { background: var(--sunk) }
.caret svg { transition: transform .15s }
.mnode.open .caret svg { transform: rotate(90deg) }
.mrow .t { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px }
.mrow .t b { font-size: 15px }
.mrow.draft .t b { text-decoration: underline dashed var(--wait-line); text-underline-offset: 4px }
.mrow .duty { display: block; margin-top: 2px; font-size: 12.5px; color: var(--body); line-height: 1.5 }
.mrow .duty i { font-style: normal; color: var(--wait); font-size: 11px; margin-right: 4px }
.mrow .cnt { font-size: 12px; color: var(--muted); white-space: nowrap; padding-top: 2px; text-align: right }
.mrow .cnt .live { color: var(--accent-ink) } .mrow .cnt .hot { color: var(--wait); font-weight: 600 }
.flist { list-style: none; margin: 0 0 8px 19px; padding: 0 0 0 18px; border-left: 1.4px solid var(--line); display: none }
.mnode.open .flist { display: block }
.flist li { position: relative }
.flist li::before { content: ""; position: absolute; left: -18px; top: 16px; width: 14px; border-top: 1.4px solid var(--line) }
.flist li:last-child::after { content: ""; position: absolute; left: -20px; top: 17px; bottom: 0; width: 4px; background: var(--surface) }
.frow { width: 100%; display: grid; grid-template-columns: 10px 1fr; column-gap: 8px; align-items: baseline; padding: 6px 8px; background: none; border: 0; border-radius: 6px; cursor: pointer; text-align: left; font: inherit; color: inherit }
.frow:hover { background: var(--sunk) }
.frow.sel { background: var(--accent-soft); color: var(--accent-ink) }
.frow.hit { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600 }
.frow .fd { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); align-self: center }
.frow .fd.draft { background: none; border: 1.4px solid var(--wait-line) }
.frow .fn { font-size: 13.5px }
.frow .fl { grid-column: 2; font-size: 12px; color: var(--muted); line-height: 1.45; font-weight: 400 }
.terse .frow .fl, .terse .mrow .duty { display: none }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 0 20px 14px; font-size: 12px; color: var(--muted) }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent) } .legend i.d { background: none; border: 1.4px solid var(--wait-line) }
.journey { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; counter-reset: s }
.journey li { position: relative; padding: 0 0 14px 34px }
.journey li::before { counter-increment: s; content: counter(s); position: absolute; left: 0; top: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--sunk); color: var(--body); font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center }
.journey li::after { content: ""; position: absolute; left: 10.5px; top: 24px; bottom: 2px; width: 1.4px; background: var(--line) }
.journey li:last-child::after { display: none }
.journey li.on::before { background: var(--accent); color: var(--surface) }
.jstep { width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 8px; padding: 2px 8px 6px; margin: -3px 0 0 -8px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; font: inherit; color: inherit }
.jstep:hover { border-color: var(--line) }
.jstep.waiting { border-style: dashed; border-color: var(--wait-line) }
.journey li.on .jstep { border-color: var(--accent); background: var(--accent-soft) }
.jstep .what { font-size: 13.5px; font-weight: 600; line-height: 1.45 }
.jstep .see { font-size: 12.5px; color: var(--muted) }
.jstep .tags { display: flex; flex-wrap: wrap; gap: 4px }
.jstep .tags span { font-size: 11px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); white-space: nowrap }
.jstep .tags span.f { color: var(--accent-ink); border-color: var(--accent) }
.jstep .tags span.u { border-style: dashed }
.relrow { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: baseline }
.kind { font-size: 11px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap }
.editing .mapcol { box-shadow: 0 0 0 2px var(--accent-soft); border-color: var(--accent) }
.ah { fill: var(--line-strong) } .ah2 { fill: var(--accent) }
.mapcol { flex: 999 1 600px; min-width: 0 }
.sidecol { flex: 1 1 320px; max-width: 440px; min-width: 0; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto }
.pbody { padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 16px }
.pbody h2 { font-size: 20px }
.plan { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column }
.plan li { display: grid; grid-template-columns: 22px 1fr auto; gap: 2px 10px; padding: 9px 0; border-top: 1px solid var(--sunk); align-items: baseline }
.plan li:first-child { border-top: 0 }
.plan .mark { width: 16px; height: 16px; border-radius: 50%; border: 1.6px solid var(--line-strong); align-self: center; position: relative }
.plan .done .mark { background: var(--ok); border-color: var(--ok) }
.plan .done .mark::after { content: ""; position: absolute; left: 4.5px; top: 1.5px; width: 4px; height: 8px; border: solid var(--surface); border-width: 0 1.8px 1.8px 0; transform: rotate(45deg) }
.plan .doing .mark { border-color: var(--accent); box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 8px var(--accent) }
.plan .dropped .mark { border-style: dashed }
.plan .title { font-weight: 600; overflow-wrap: anywhere }
.plan .done .title { font-weight: 400 }
.plan .dropped .title { text-decoration: line-through; color: var(--muted); font-weight: 400 }
.plan .note { grid-column: 2 / 4; font-size: 13px; color: var(--muted); overflow-wrap: anywhere }
.plan .doing, .plan .todo { background: var(--band); margin-inline: -10px; padding-inline: 10px; border-radius: 6px }
.progress { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden }
.progress i { display: block; height: 100%; background: var(--ok) }
.nowbox { padding: 12px 14px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent-ink); border-radius: 8px }
.more { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 6px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; text-align: left }
.more:hover { border-color: var(--accent) }
.more b { flex: 1 1 auto }
.more::after { content: ""; flex: none; width: 7px; height: 7px; border-right: 1.6px solid var(--muted); border-top: 1.6px solid var(--muted); transform: rotate(45deg) }
dialog { width: min(720px, calc(100vw - 32px)); max-height: min(80vh, 760px); padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); box-shadow: 0 20px 60px rgba(0, 0, 0, .25); overflow: hidden }
dialog[open] { display: flex; flex-direction: column }
dialog::backdrop { background: rgba(10, 14, 22, .45) }
.dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--band) }
.dlg-close { width: 36px; height: 36px; border: 0; border-radius: 6px; background: none; font-size: 22px; line-height: 1; color: var(--muted); cursor: pointer }
.dlg-close:hover { background: var(--sunk) }
.dlg-body { padding: 14px 20px 20px; overflow: auto }
.tl-axis { position: relative; height: 52px; margin: 6px 6px 12px; border-bottom: 2px solid var(--line-strong) }
.tl-tick { position: absolute; top: 0; bottom: 0; box-sizing: border-box; display: flex; flex-direction: column; align-items: flex-start; gap: 0; padding: 4px 8px; background: none; border: 0; border-left: 1px solid var(--line); border-radius: 0 6px 0 0; font-size: 13px; color: var(--fg); white-space: nowrap; overflow: hidden; cursor: pointer; text-align: left }
.tl-tick small { font-size: 11px; color: var(--muted) }
.tl-tick:hover { background: var(--sunk) }
.tl-tick[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600 }
.tl-tick:disabled { color: var(--muted); cursor: default; background: none }
.tl-axis i { position: absolute; bottom: -7px; width: 12px; height: 12px; margin-left: -6px; box-sizing: border-box; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); pointer-events: none }
.tl-axis i.latest { background: var(--accent) }
.tl-axis i.dim { opacity: .25 }
.tl-day { margin: 18px 0 8px }
.tl { list-style: none; margin: 0; padding: 0 }
.tl li { position: relative; display: grid; grid-template-columns: 44px 14px 1fr; gap: 0 10px; padding-bottom: 14px; align-items: start }
.tl li::before { content: ""; position: absolute; left: 60.5px; top: 14px; bottom: -4px; width: 1px; background: var(--line-strong) }
.tl li:last-child::before { display: none }
.tl li:last-child { padding-bottom: 0 }
.tl time { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; padding-top: 3px }

.tl .latest .knot { background: var(--accent) }
.tl .latest .what { font-weight: 600 }
.tl .what { overflow-wrap: anywhere }
.delta { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px }
.delta .tile.mini { max-width: none; gap: 2px }
.scard-warn { align-self: flex-start; padding: 1px 8px; border-radius: 10px; font-size: 12px; background: var(--wait-soft); color: var(--wait) }
.clash { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin: 0 }
.clash b.soft { border-color: var(--line-strong); color: var(--body) }
.clash b { flex: none; padding: 1px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--wait-line); color: var(--wait); font-size: 13px }
.chip { display: inline-flex; flex-direction: column; align-items: flex-start; padding: 4px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 13px; text-align: left }
.chip:hover { border-color: var(--accent) }
.chip.warn { background: var(--wait-soft); border-color: var(--wait-line); color: var(--wait) }
.chip small { font-size: 11px }
.chip b { font-weight: 600 }
.tile .cnt.hot { color: var(--wait); font-weight: 600 }
.switch { padding: 4px 10px; background: none; border: 1px solid var(--line); border-radius: 6px; color: var(--body); cursor: pointer }
.switch::after { content: ""; display: inline-block; width: 6px; height: 6px; margin: 0 2px 3px 8px; border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted); transform: rotate(45deg) }
.switch:hover { border-color: var(--accent) }
a.scard { text-decoration: none; color: inherit }
a.scard[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft) }
.sstrip { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px }
.scard { display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 12px 14px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; cursor: pointer }
.scard:hover { border-color: var(--accent) }
.scard[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft) }
.scard.stale { background: var(--band) }
.scard.stale b, .scard.stale .scard-doing { color: var(--muted) }
.scard-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px }
.scard-top b { font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.scard-doing { font-size: 13px; color: var(--body); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.9em }
.scard-foot { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted) }
.scard-branch { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono) }
.scard-foot span:last-child { flex: none }
.scard.more-old { justify-content: center; align-items: center; border-style: dashed; gap: 2px }
.pill.sub { background: var(--sunk); color: var(--body) }
.back { align-self: flex-start }
@media (max-width: 720px) { .sidecol { max-width: none } .tile, .tile.mini { flex: 1 1 130px; max-width: none } }
.embed .bar { display: none }
.dprev { position: relative; display: block; width: 100%; height: 230px; padding: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: zoom-in }
.dprev iframe { position: absolute; top: 0; left: 0; width: 300%; height: 300%; border: 0; transform: scale(.3333); transform-origin: 0 0; pointer-events: none; background: #fff }

dialog.wide { width: calc(100vw - 48px); max-width: none; height: calc(100vh - 48px); max-height: none } dialog.wide .dlg-body { flex: 1; padding: 0; overflow: hidden }

    var t = e.target.closest('[data-page],[data-open],[data-sel],[data-win],[data-layer],[data-expand],[data-collapse],[data-terse],[data-j],[data-step],[data-gostep],[data-edit]');
    if (!t) return;
    if (dlg.open && dlg.close) dlg.close();
    var d = t.dataset, y = window.scrollY;
    if (d.page) { S.page = d.page; hash(d.page); show(); return; }
    if (d.open) { open(d.open); return; }
    if (d.edit != null) { S.editing = !S.editing; document.documentElement.classList.toggle('editing', S.editing); try { parent.postMessage({ rf: 'map-edit', open: S.editing }, '*'); } catch (err) {} }
    else if (d.sel) { if (S.sel === d.sel && byId[d.sel].type === 'module') S.sel = null; else choose(d.sel); hash(S.sel || 'map'); }
    else if (d.win) S.win = +d.win;
    else if (d.layer) S.layer = d.layer;
    else if (d.expand != null || d.collapse != null) D.modules.forEach(function (m) { if (LAYER_OF[m.id] === layerNow()) S.open[m.id] = d.expand != null ? 1 : 0; });
    else if (d.terse != null) S.terse = !S.terse;
    else if (d.j != null) { S.j = +d.j; S.step = null; }
    else if (d.step != null) { var i = +d.step; S.step = S.step === i ? null : i; }
    else if (d.gostep) { var g = d.gostep.split('|'), jr = JOURNEYS.filter(function (x) { return x.id === g[0]; })[0]; if (jr) { choose(jr.module); S.j = journeysOf(jr.module).indexOf(jr); S.step = +g[1]; hash(jr.module); } }
    keep();
    show(y);
  });
  window.addEventListener('hashchange', route);
  document.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('mrow')) { e.preventDefault(); e.target.click(); } });
  // 知识保鲜：应用把哪些功能点可能过时、核对到哪了交进来（app/src/main/fresh.js），这里只显示
  window.addEventListener('message', function (e) { if (e.data && e.data.rf === 'map-fresh' && e.data.data && typeof e.data.data === 'object') { S.fresh = e.data.data; if (S.page === 'map') show(window.scrollY); } });
  window.addEventListener('message', function (e) { if (e.data && e.data.rf === 'map-edit-state' && S.editing !== !!e.data.open) { S.editing = !!e.data.open; document.documentElement.classList.toggle('editing', S.editing); if (S.page === 'map') show(window.scrollY); } });
  if (EMBED && /[?&]editing=1/.test(location.search)) { S.editing = true; document.documentElement.classList.add('editing'); }
  var others = D.projects || [];
  if (others.length > 1) document.getElementById('project').innerHTML = uiText('<button type="button" class="switch" data-modal="projects">项目：', "<button type=\"button\" class=\"switch\" data-modal=\"projects\">Project: ") + esc(D.project) + '</button>';
  else document.getElementById('project').textContent = uiText('项目：', "Project: ") + D.project;
  route();
  if (!document.getElementById('page').firstChild) show();  // the address may name the page we already start on
  if (location.protocol.indexOf('http') === 0 && location.port) {
    var version = null;
    setInterval(function () { fetch('api/version').then(function (r) { return r.json(); }).then(function (v) { if (version && v.version !== version) location.reload(); version = v.version; }).catch(function () {}); }, 4000);
  }
})();
