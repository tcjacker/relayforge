<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlowNote · 轻量任务板</title>
<style>
:root{font:15px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif;color:#25372e;background:#f5f7f2}*{box-sizing:border-box}body{max-width:1150px;margin:auto;padding:48px 28px}header{display:flex;align-items:center;gap:16px;margin-bottom:36px}h1{font-size:30px;margin:0;letter-spacing:-1px}p{margin:0;color:#748078}small{color:#748078}.grow{flex:1}button,input,select{font:inherit;border:1px solid #dbe1d6;border-radius:9px;padding:9px 14px;background:white;color:inherit}button{cursor:pointer}button:hover{border-color:#58896e}.primary{background:#285e43;color:white;border-color:#285e43}form{display:flex;gap:10px;margin:24px 0}input{flex:1;min-width:0}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:24px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.column{padding:16px;background:#eaf0e6;border-radius:14px;min-height:280px}h2{font-size:13px;letter-spacing:1px;margin:0 0 16px;color:#6a7c6e}.task{background:white;padding:18px;border:1px solid #dfe5da;border-radius:10px;margin-bottom:12px}.task b{display:block;font-size:16px;margin:8px 0 18px}.task button{font-size:12px;padding:4px 9px}.tag{font-size:11px;background:#f1f3ec;border-radius:5px;padding:3px 7px}.high{color:#a44f2a;background:#fcf0e7}#message{min-height:24px;color:#8a492c}footer{margin-top:28px;color:#889186;font-size:12px}@media(max-width:700px){.board{grid-template-columns:1fr}form,header{flex-wrap:wrap}body{padding:24px 16px}}
</style>
<header><div><h1>FlowNote<span style="color:#9ba992">.</span></h1><p>把今天，整理得轻一点。</p></div><span class="grow"></span><small>离线演示 · 数据仅保存在本机</small></header>
<div class="toolbar"><div><h2>完成趋势 · 设计稿</h2><b>每周都看见一点进步</b></div><span class="grow"></span><button id="week">切换到上一周</button></div><section class="column" style="min-height:300px"><h2 id="period">本周 · 完成 18 件事</h2><div style="display:flex;align-items:end;gap:20px;height:210px" id="bars"></div></section><footer>FlowNote 是 RelayForge 的虚构示例项目，可用于体验需求、设计稿、大图和验收流程。</footer>
<script>let previous=false;function draw(){document.getElementById('period').textContent=previous?'上周 · 完成 14 件事':'本周 · 完成 18 件事';document.getElementById('week').textContent=previous?'切换到本周':'切换到上一周';document.getElementById('bars').replaceChildren(...[2,4,1,3,5,2,1].map((n,i)=>{const bar=document.createElement('div');bar.style.cssText='flex:1;background:#58896e;border-radius:8px 8px 0 0;text-align:center;color:white;padding-top:8px;height:'+((previous?Math.max(1,n-1):n)*32)+'px';bar.textContent=['一','二','三','四','五','六','日'][i];return bar}))}document.getElementById('week').onclick=()=>{previous=!previous;draw()};draw();</script></html>
