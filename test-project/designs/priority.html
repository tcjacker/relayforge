<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlowNote · 轻量任务板</title>
<style>
:root{font:15px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif;color:#25372e;background:#f5f7f2}*{box-sizing:border-box}body{max-width:1150px;margin:auto;padding:48px 28px}header{display:flex;align-items:center;gap:16px;margin-bottom:36px}h1{font-size:30px;margin:0;letter-spacing:-1px}p{margin:0;color:#748078}small{color:#748078}.grow{flex:1}button,input,select{font:inherit;border:1px solid #dbe1d6;border-radius:9px;padding:9px 14px;background:white;color:inherit}button{cursor:pointer}button:hover{border-color:#58896e}.primary{background:#285e43;color:white;border-color:#285e43}form{display:flex;gap:10px;margin:24px 0}input{flex:1;min-width:0}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:24px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.column{padding:16px;background:#eaf0e6;border-radius:14px;min-height:280px}h2{font-size:13px;letter-spacing:1px;margin:0 0 16px;color:#6a7c6e}.task{background:white;padding:18px;border:1px solid #dfe5da;border-radius:10px;margin-bottom:12px}.task b{display:block;font-size:16px;margin:8px 0 18px}.task button{font-size:12px;padding:4px 9px}.tag{font-size:11px;background:#f1f3ec;border-radius:5px;padding:3px 7px}.high{color:#a44f2a;background:#fcf0e7}#message{min-height:24px;color:#8a492c}footer{margin-top:28px;color:#889186;font-size:12px}@media(max-width:700px){.board{grid-template-columns:1fr}form,header{flex-wrap:wrap}body{padding:24px 16px}}
</style>
<header><div><h1>FlowNote<span style="color:#9ba992">.</span></h1><p>把今天，整理得轻一点。</p></div><span class="grow"></span><small>离线演示 · 数据仅保存在本机</small></header>
<div class="toolbar"><b id="count"></b><span class="grow"></span><label>优先级 <select id="filter"><option value="all">全部</option><option value="high">高优先级</option><option value="normal">普通</option></select></label><button id="export">导出 JSON</button></div>
<form id="new"><input id="title" placeholder="下一件想完成的小事…" aria-label="任务名称" required maxlength="80"><select id="priority" aria-label="优先级"><option value="normal">普通优先级</option><option value="high">高优先级</option></select><button class="primary">添加任务</button></form><p id="message" role="status"></p><div class="board" id="board"></div>
<footer>FlowNote 是 RelayForge 的虚构示例项目，可用于体验需求、设计稿、大图和验收流程。</footer>
<script>
const key='flownote.tasks.v1';const initial=[{id:1,title:'梳理本周的三个重点',priority:'high',status:'todo'},{id:2,title:'整理产品演示路线',priority:'normal',status:'doing'},{id:3,title:'准备周五的读书清单',priority:'normal',status:'todo'},{id:4,title:'让任务可以导出为 JSON',priority:'high',status:'done'}];let tasks=initial.map(t=>({...t}));let storageReady=true;
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved!==null){if(!Array.isArray(saved)||saved.some(t=>typeof t.title!=='string'||!['todo','doing','done'].includes(t.status)||!['high','normal'].includes(t.priority)))throw Error('invalid data');tasks=saved}}catch(e){storageReady=false;document.getElementById('message').textContent='本地数据暂时无法读取，现显示示例任务；原数据未覆盖。'}
function save(){if(!storageReady){document.getElementById('message').textContent='当前是临时预览，原本地数据未覆盖。';return}try{localStorage.setItem(key,JSON.stringify(tasks));document.getElementById('message').textContent='已保存在此浏览器。'}catch(e){document.getElementById('message').textContent='保存失败，请先导出任务以保留本次修改。'}}
function render(){document.getElementById('count').textContent=`${tasks.filter(t=>t.status==='done').length} / ${tasks.length} 件事已完成`;const board=document.getElementById('board');board.replaceChildren();for(const [state,label] of [['todo','待办'],['doing','进行中'],['done','已完成']]){const col=document.createElement('section');col.className='column';const heading=document.createElement('h2');heading.textContent=label;col.append(heading);for(const task of tasks.filter(t=>t.status===state&&(document.getElementById('filter').value==='all'||t.priority===document.getElementById('filter').value))){const card=document.createElement('article');card.className='task';const tag=document.createElement('span');tag.className='tag '+(task.priority==='high'?'high':'');tag.textContent=task.priority==='high'?'高优先级':'普通';const title=document.createElement('b');title.textContent=task.title;const next=document.createElement('button');next.textContent=state==='done'?'重新开始':state==='todo'?'开始处理 →':'标记完成 ✓';next.onclick=()=>{task.status=state==='todo'?'doing':state==='doing'?'done':'todo';save();render()};card.append(tag,title,next);col.append(card)}board.append(col)}}
document.getElementById('new').onsubmit=e=>{e.preventDefault();const title=document.getElementById('title');if(!title.value.trim())return;tasks.unshift({id:Date.now(),title:title.value.trim(),priority:document.getElementById('priority').value,status:'todo'});title.value='';save();render()};document.getElementById('filter').onchange=render;document.getElementById('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='flownote-tasks.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();
</script></html>
